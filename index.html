<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- TEXTE A MODIFIER : Titre de l'onglet du navigateur -->
  <title>Mon Projet Webhook</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      /* Fond global bleu clair doux */
      background-color: #e0f2fe;
      color: #0369a1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      /* Carte centrale bleu glacier avec ombre contrastée */
      background: #f0f9ff;
      padding: 32px;
      border-radius: 16px;
      border: 2px solid #bae6fd;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      /* Bleu profond contrasté pour la lisibilité */
      color: #0c4a6e;
      text-align: center;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #0284c7;
      margin-bottom: 24px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #0369a1;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 14px;
      border-radius: 10px;
      border: 2px solid #7dd3fc;
      background-color: #ffffff;
      color: #0c4a6e;
      font-size: 1rem;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }

    /* Bordure renforcée au clic */
    textarea:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      /* Bouton bleu clair vif */
      background-color: #38bdf8;
      color: #0c4a6e;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      /* Assombrissement au survol */
      background-color: #0284c7;
      color: #ffffff;
    }

    #status {
      margin-top: 18px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      min-height: 22px;
    }

    .success {
      color: #0284c7;
    }

    .error {
      color: #e11d48;
    }

    .loading {
      color: #0ea5e9;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- TEXTE A MODIFIER : Grand titre principal -->
    <h1>Titre de ton site</h1>
    
    <!-- TEXTE A MODIFIER : Description sous le titre -->
    <p class="subtitle">Écris ta petite description ici pour expliquer le site.</p>

    <form id="webhookForm">
      <!-- TEXTE A MODIFIER : Libellé au-dessus du champ texte -->
      <label for="userText">Ton texte :</label>
      
      <!-- TEXTE A MODIFIER : Le placeholder (texte indicatif dans la zone) -->
      <textarea id="userText" placeholder="Tape ton texte ici..." required></textarea>
      
      <!-- TEXTE A MODIFIER : Texte du bouton de validation -->
      <button type="submit">Envoyer le message</button>
    </form>

    <p id="status"></p>
  </div>

  <script>
    // COLLE TON URL DE WEBHOOK DISCORD ENTRE LES GUILLEMETS CI-DESSOUS
    const WEBHOOK_URL = "TON_WEBHOOK_DISCORD_ICI";

    document.getElementById('webhookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const textInput = document.getElementById('userText').value;
      const status = document.getElementById('status');

      // TEXTE A MODIFIER : Message d'attente
      status.className = "loading";
      status.textContent = "Envoi en cours...";

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: textInput
          })
        });

        if (response.ok) {
          status.className = "success";
          // TEXTE A MODIFIER : Message de succès
          status.textContent = "Message envoyé avec succès !";
          document.getElementById('userText').value = '';
        } else {
          status.className = "error";
          // TEXTE A MODIFIER : Message d'erreur serveur
          status.textContent = "Erreur lors de l'envoi.";
        }
      } catch (error) {
        status.className = "error";
        // TEXTE A MODIFIER : Message d'erreur réseau
        status.textContent = "Erreur réseau. Vérifie ta connexion.";
      }
    });
  </script>

</body>
</html>
