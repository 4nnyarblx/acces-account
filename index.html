<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloxDesk — Support & Signalement</title>
  
  <!-- Polices Google Fonts & Icônes FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: rgba(22, 26, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #00a2ff;
      --accent-hover: #0081cc;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: rgba(10, 12, 18, 0.6);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 162, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    /* Logo Roblox SVG personnalisé */
    .roblox-logo {
      width: 52px;
      height: 52px;
      fill: var(--text-main);
      margin-bottom: 12px;
      transition: transform 0.3s ease;
    }

    .container:hover .roblox-logo {
      transform: rotate(-10deg) scale(1.05);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 550px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    label i {
      margin-right: 6px;
      color: var(--accent);
    }

    input, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 162, 255, 0.15);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Message de confirmation / erreur */
    .status-message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 20px;
    }

    .status-message.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
    }

    .status-message.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
    }

    /* Spinner de chargement */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <!-- Logo Officiel Roblox (style incline) -->
      <svg class="roblox-logo" viewBox="0 0 24 24">
        <path d="M18.5 24L0 18.5 5.5 0 24 5.5 18.5 24zM10.1 8.6l-1.4 4.8 4.8 1.4 1.4-4.8-4.8-1.4z"/>
      </svg>
      <h1>BloxDesk</h1>
      <p>Transmets-nous ton message ou ton signalement directement à l'équipe.</p>
    </div>

    <!-- Zone pour afficher le statut du message -->
    <div id="statusMessage" class="status-message"></div>

    <form id="webhookForm">
      <!-- Section 1 : Informations utilisateur -->
      <div class="form-row">
        <div class="form-group">
          <label for="discordId"><i class="fa-brands fa-discord"></i> ID Discord</label>
          <input type="text" id="discordId" placeholder="Ex: 282479237092802560" required>
        </div>
        <div class="form-group">
          <label for="robloxUser"><i class="fa-solid fa-user"></i> Pseudo / Username</label>
          <input type="text" id="robloxUser" placeholder="Ex: Builderman" required>
        </div>
      </div>

      <!-- Section 2 : Zone de texte grande -->
      <div class="form-group">
        <label for="userMessage"><i class="fa-solid fa-message"></i> Ton Message</label>
        <textarea id="userMessage" placeholder="Rédige ton message ici..." required></textarea>
      </div>

      <!-- Bouton d'envoi -->
      <button type="submit" id="btnSubmit" class="btn-submit">
        <span id="btnText">Envoyer le message</span>
        <div id="btnSpinner" class="spinner"></div>
      </button>
    </form>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1537505090611712181/AbVG3XE6fjOtE7OA3wwOhI2w1rd56Wwwaz3C-99DR5Am-n8YPYJBWz0MtIoKVJzN9nxc";

    const form = document.getElementById('webhookForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Récupération des valeurs des champs
      const discordId = document.getElementById('discordId').value.trim();
      const robloxUser = document.getElementById('robloxUser').value.trim();
      const messageContent = document.getElementById('userMessage').value.trim();

      // UI : Activation du chargement
      btnSubmit.disabled = true;
      btnText.textContent = "Envoi en cours...";
      btnSpinner.style.display = "block";
      statusMessage.className = "status-message";

      // Construction de l'embed Discord stylisé
      const payload = {
        username: "BloxDesk Bot",
        avatar_url: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_2017.svg",
        embeds: [
          {
            title: "📥 Nouveau message reçu !",
            color: 39423, // Couleur bleue (#00A2FF en decimal)
            fields: [
              {
                name: "👤 Pseudo Roblox",
                value: robloxUser || "Non renseigné",
                inline: true
              },
              {
                name: "🆔 ID Discord",
                value: discordId ? `<@${discordId}> (${discordId})` : "Non renseigné",
                inline: true
              },
              {
                name: "📝 Message",
                value: messageContent.length > 1024 ? messageContent.substring(0, 1020) + "..." : messageContent
              }
            ],
            footer: {
              text: "BloxDesk • Système de transmission"
            },
            timestamp: new Date().toISOString()
          }
        ]
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMessage.textContent = "✅ Ton message a été transmis avec succès à l'équipe !";
          statusMessage.classList.add('success');
          form.reset(); // Réinitialise les champs
        } else {
          throw new Error("Erreur de réponse du serveur");
        }
      } catch (error) {
        statusMessage.textContent = "❌ Une erreur est survenue lors de l'envoi. Réessaye plus tard.";
        statusMessage.classList.add('error');
      } finally {
        // UI : Rétablissement du bouton
        btnSubmit.disabled = false;
        btnText.textContent = "Envoyer le message";
        btnSpinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
